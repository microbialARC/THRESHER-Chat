{% set name = "thresher-chat" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # TODO: set sha256 once the v{{ version }} tag is pushed:
  #   curl -L <url> | shasum -a 256
  url: https://github.com/microbialARC/THRESHER-Chat/archive/refs/tags/v{{ version }}.tar.gz
  sha256: TODO

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - thresher-chat = thresher_chat.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=3.11
    - langchain >=1.2.10
    - langchain-core >=1.2.10
    - langchain-chroma >=1.1.0
    - langchain-community >=0.4.1
    - langchain-ollama >=1.0.1
    - langchain-text-splitters >=1.1.0
    - chromadb >=1.5.0
    # PyPI "ollama" (Python client) is "ollama-python" on conda-forge
    - ollama-python >=0.6.1
    # conda-forge "ollama" is the Ollama server/CLI itself
    - ollama
    - flask >=3.1.2
    - psutil >=5.9
    - requests >=2.32.5

test:
  imports:
    - thresher_chat
    - thresher_chat.server
  commands:
    - thresher-chat --help
    - thresher-chat --version

about:
  home: https://github.com/microbialARC/THRESHER-Chat
  summary: Local offline AI assistant for the THRESHER bacterial phylogenomics toolkit.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - TODO  # GitHub username(s)
